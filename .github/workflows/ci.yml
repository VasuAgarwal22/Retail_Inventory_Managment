name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: retail_inventory_managment
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retail_inventory_managment"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CLASS_NAME: org.postgresql.Driver
      DB_URL: jdbc:postgresql://localhost:5432/retail_inventory_managment
      DB_USERNAME: postgres
      DB_PASS: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/retailstock-angular

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/retailstock-angular/package-lock.json

      - name: Install frontend dependencies
        # The current package-lock.json is out of sync with package.json.
        # Regenerate and commit the lockfile, then switch back to a frozen install.
        run: npm install --no-audit --no-fund

      - name: Build Angular application
        run: npm run build
